spring.application.name=conference-service-test

security.jwt.secret=test_secret_key_with_at_least_32_chars

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

integration.iam.base-url=http://localhost:8081
integration.wallet.base-url=http://localhost:8083
integration.wallet.service-token=test-service-token

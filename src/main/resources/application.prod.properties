# ============================================================
# Configuracion produccion
# Proyecto AyD2 P2B
# ============================================================

spring.application.name=conference-service

# server.port=8082
server.port=${SERVER_PORT:8082}

# ============================================================
# Datasource PostgreSQL
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/conference_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:conference_service_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:conference_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Mostrar SQL solo en local. En produccion debe ir en false.
spring.jpa.show-sql=false

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ============================================================
# OpenAPI / Swagger
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# Seguridad / JWT
# Conference no emite tokens; valida tokens emitidos por IAM.
# Debe usar el mismo secret que IAM mientras el proyecto use JWT simetrico.
# En produccion debe venir desde variables de entorno o secrets.
# ============================================================

security.jwt.secret=${SECURITY_JWT_SECRET:change_me_super_secret_key_at_least_32_chars_long}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ============================================================
# Integracion IAM Service
# ============================================================
integration.iam.base-url=${INTEGRATION_IAM_BASE_URL:http://localhost:8081}
integration.iam.service-token=${CONFERENCE_IAM_SERVICE_TOKEN:}

# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${EUREKA_INSTANCE_IPADDRESS}

# ============================================================
# Integracion IAM Service
# ============================================================

integration.iam.base-url=${INTEGRATION_IAM_BASE_URL:http://localhost:8081}

# ============================================================
# Integracion Wallet Service
# ============================================================

integration.wallet.base-url=${INTEGRATION_WALLET_BASE_URL:http://localhost:8083}
# Shared secret sent as X-Service-Token to wallet-service POST /payments/register.
# Must match integration.conference.service-token in wallet-service.
integration.wallet.service-token=${CONFERENCE_WALLET_SERVICE_TOKEN}


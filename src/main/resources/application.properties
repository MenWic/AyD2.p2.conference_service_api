# ============================================================
# Configuracion local
# Proyecto AyD2 P2B
# ============================================================

spring.application.name=conference-service

server.port=8082

# ============================================================
# Datasource PostgreSQL
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/conference_db
spring.datasource.username=conference_service_user
spring.datasource.password=conference_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Mostrar SQL solo en local. En produccion debe ir en false.
spring.jpa.show-sql=true

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ============================================================
# OpenAPI / Swagger
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# Eureka
# Por defecto el servicio corre individual, sin registrarse.
# Para registrarse en Eureka usar el perfil discovery.
# ============================================================

eureka.client.enabled=false

# ============================================================
# Seguridad / JWT
# Conference no emite tokens; valida tokens emitidos por IAM.
# Debe usar el mismo secret que IAM mientras el proyecto use JWT simetrico.
# En produccion debe venir desde variables de entorno o secrets.
# ============================================================

security.jwt.secret=${SECURITY_JWT_SECRET:change_me_super_secret_key_at_least_32_chars_long}

# ============================================================
# CORS local
# Ajustar cuando el frontend tenga puerto definitivo.
# ============================================================

app.cors.allowed-origins=http://localhost:3000
